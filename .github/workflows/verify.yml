name: Verify app

on:
  pull_request:
    branches: [main]
  push:
    branches: [inventory/p0-migration-review]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint
      - name: Run test suite
        run: npm test
      - name: Production build
        run: npm run build
