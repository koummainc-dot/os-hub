name: Finance OS SQL smoke tests

on:
  pull_request:
    paths:
      - "supabase/migrations/*finance*"
      - "supabase/tests/finance_family_cash_smoke.sql"
      - "tests/finance_sql_bootstrap.sql"
      - "tests/t_finance_*.mjs"
      - "src/systems/finance/**"
      - ".github/workflows/finance-os-sql-smoke.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/*finance*"
      - "supabase/tests/finance_family_cash_smoke.sql"
      - "tests/finance_sql_bootstrap.sql"
      - "tests/t_finance_*.mjs"
      - "src/systems/finance/**"
      - ".github/workflows/finance-os-sql-smoke.yml"

permissions:
  contents: read

jobs:
  finance-postgres-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: finance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d finance_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: finance_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Finance contract regression
        run: node tests/t_finance_family_cash_contract.mjs
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Bootstrap disposable database
        run: psql -v ON_ERROR_STOP=1 -f tests/finance_sql_bootstrap.sql
      - name: Apply Finance family cash migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261030130000_finance_family_cash_tracking.sql
      - name: Verify Finance family cash ledger safety, limits, RLS and workspace isolation
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/finance_family_cash_smoke.sql
