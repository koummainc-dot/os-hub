name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run test suite
        run: npm test
      - name: Build production app
        run: npm run build

  spiritual-postgres-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: spiritual_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d spiritual_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: spiritual_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Bootstrap disposable Spiritual OS schema
        run: psql -v ON_ERROR_STOP=1 -f tests/spiritual_os_sql_bootstrap.sql
      - name: Apply Spiritual OS migrations
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261103090432_spiritual_values_foundation.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261103090434_spiritual_practice_logs.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261103090436_spiritual_practice_log_integrity.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261103090438_spiritual_client_side_encryption.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261103090441_spiritual_record_relations.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261103090443_spiritual_integration_privacy.sql
      - name: Verify owner isolation, encrypted payloads, relations, and RPC access
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/spiritual_os_smoke.sql
