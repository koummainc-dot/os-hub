name: Finance Family Center Checks

on:
  pull_request:
    branches: [main]
    paths:
      - "src/systems/finance/**"
      - "src/core/core.js"
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/finance-family-checks.yml"

permissions:
  contents: read

jobs:
  build-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Existing regression suite
        run: npm test
